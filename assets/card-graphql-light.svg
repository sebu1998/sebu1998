<svg xmlns="http://www.w3.org/2000/svg" width="600" height="212" viewBox="0 0 600 212" role="img" aria-label="GraphQL Backend: Modern API for a legacy WPF suite" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0.5" y="0.5" width="599" height="211" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="0" y="0" width="6" height="212" fill="#1f6b57" clip-path="inset(0 round 14px 0 0 14px)"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.6s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" letter-spacing="-0.6">GraphQL Backend</text>
    <text x="40" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Modern API for a legacy WPF suite</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.60s" fill="freeze"/>
    <text x="40" y="104" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f6b57">C# · .NET 10 · HotChocolate · EF Core</text>
    <text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328">Clean architecture in front of a large legacy SQL Server schema,</text>
    <text x="40" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328">fully compatible with the existing desktop client.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.75s" fill="freeze"/>
    
    <text x="40" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">in development</text>
    <rect x="430" y="168" width="138" height="24" rx="12" fill="#e8f3ef"/>
    <text x="499" y="184.5" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f6b57" text-anchor="middle">module by module</text>
  </g>
</svg>

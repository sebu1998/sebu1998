<svg xmlns="http://www.w3.org/2000/svg" width="600" height="212" viewBox="0 0 600 212" role="img" aria-label="Kommandozentrale: Self-run service platform on my VPS" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0.5" y="0.5" width="599" height="211" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="0" y="0" width="6" height="212" fill="#1f6b57" clip-path="inset(0 round 14px 0 0 14px)"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.6s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" letter-spacing="-0.6">Kommandozentrale</text>
    <text x="40" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Self-run service platform on my VPS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.50s" fill="freeze"/>
    <text x="40" y="104" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f6b57">Node 22 · TypeScript · PostgreSQL · Docker · GitHub Actions</text>
    <text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328">Seven small services, one Postgres, a deploy key per stack,</text>
    <text x="40" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328">monitoring and daily backups. CI enforces the data boundaries.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.65s" fill="freeze"/>
    
  <circle cx="44" cy="180" r="4" fill="#1f6b57">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="180" r="4" fill="none" stroke="#1f6b57" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="4;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
    <text x="58" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">running since 08/2026</text>
    <rect x="468" y="168" width="100" height="24" rx="12" fill="#e8f3ef"/>
    <text x="518" y="184.5" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#1f6b57" text-anchor="middle">194 commits</text>
  </g>
</svg>

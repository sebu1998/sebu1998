<svg xmlns="http://www.w3.org/2000/svg" width="600" height="212" viewBox="0 0 600 212" role="img" aria-label="KuRD-GNSS: RTK surveying app · iOS + Android" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0.5" y="0.5" width="599" height="211" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="6" height="212" fill="#4fb39a" clip-path="inset(0 round 14px 0 0 14px)"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur="0.6s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6edf3" letter-spacing="-0.6">KuRD-GNSS</text>
    <text x="40" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">RTK surveying app · iOS + Android</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.30s" fill="freeze"/>
    <text x="40" y="104" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#4fb39a">React · TypeScript · GNSS/RTK · SAPOS</text>
    <text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3">Field crews measure cable and pipe runs to two centimetres</text>
    <text x="40" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3">and export the as-built sketch for the utility on the spot.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.45s" fill="freeze"/>
    
  <circle cx="44" cy="180" r="4" fill="#4fb39a">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="180" r="4" fill="none" stroke="#4fb39a" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="4;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
    <text x="58" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">rolling out to field crews</text>
    <rect x="461" y="168" width="107" height="24" rx="12" fill="#1c2a26"/>
    <text x="514" y="184.5" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#4fb39a" text-anchor="middle">4,600+ tests</text>
  </g>
</svg>

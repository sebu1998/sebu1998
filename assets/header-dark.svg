<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Sebastian Bührmann, software developer for web, mobile and desktop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#4fb39a"/>
      <stop offset="1" stop-color="#2a7f6a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="16" fill="#0d1117" stroke="#30363d"/>
  <line x1="712" y1="56" x2="712" y2="264" stroke="#30363d"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.7s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <text x="64" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Sebastian Bührmann</text>
  </g>
  <rect x="64" y="118" width="0" height="4" rx="2" fill="url(#line)">
    <animate attributeName="width" from="0" to="180" dur="1.1s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <text x="64" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf3">Software developer for web, mobile and desktop.</text>
  </g>
  
    <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" opacity="0">
      Web platforms with Laravel and Vue
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.033;0.217;0.250;1" dur="12s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" opacity="0">
      iOS apps with Swift and SwiftUI
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.283;0.467;0.500;1" dur="12s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" opacity="0">
      Offline-first PWAs with React
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.533;0.717;0.750;1" dur="12s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#8b949e" opacity="0">
      GraphQL backends with .NET
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.750;0.783;0.967;1" dur="12s" begin="1.2s" repeatCount="indefinite"/>
    </text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/>
    <text x="64" y="226" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8b949e">Laravel   Swift   React   TypeScript   .NET   GraphQL   PostgreSQL   Docker</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.2s" fill="freeze"/>
    <text x="64" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Open to new roles from February 2027, anywhere in Germany or remote.</text>
  </g>
  
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.6s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <text x="760" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3" letter-spacing="-1">4,600+</text>
      <text x="760" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">automated tests on one product</text>
      <rect x="760" y="116" width="0" height="3" rx="1.5" fill="#4fb39a">
        <animate attributeName="width" from="0" to="300" dur="1.4s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.6s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <text x="760" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3" letter-spacing="-1">12</text>
      <text x="760" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">apps and services in daily use</text>
      <rect x="760" y="190" width="0" height="3" rx="1.5" fill="#4fb39a">
        <animate attributeName="width" from="0" to="260" dur="1.4s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.6s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <text x="760" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3" letter-spacing="-1">2 cm</text>
      <text x="760" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">field-verified positioning accuracy</text>
      <rect x="760" y="264" width="0" height="3" rx="1.5" fill="#4fb39a">
        <animate attributeName="width" from="0" to="240" dur="1.4s" begin="1.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      </rect>
    </g>
</svg>
